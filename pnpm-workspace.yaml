packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  supabase: true
  workerd: true

# Auto-approve native build scripts for known tools (esbuild, supabase, workerd).
# See https://pnpm.io/settings#onlybuiltdependencies
onlyBuiltDependencies:
  - esbuild
  - workerd
  - "@tailwindcss/oxide"
  - "@swc/core"
  - "@biomejs/biome"
  - "core-js"
  - "better-sqlite3"
